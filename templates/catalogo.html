{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>

    <div id="carouselExampleControls" class="carousel slide mi-carrusel" data-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='productos/calaverita.png') }}" class="d-block w-100" alt="Vaso">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='productos/figuras.png') }}" class="d-block w-100" alt="Disfraz">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='productos/galletitas.png') }}" class="d-block w-100" alt="Ofrenda">
            </div>
        </div>

        <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Anterior</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Siguiente</span>
        </a>
    </div>
</div>
{% endblock %}
